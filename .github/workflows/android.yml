name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Capacitor
        run: npm install
      - name: Prepare web assets
        run: |
          mkdir -p www
          cp forja.html www/index.html
          cp manifest.webmanifest sw.js www/
          cp -r icons www/
      - name: Create Android project
        run: |
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' "$M"
          npx cap sync android
      - name: App icon and name
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp android-icons/mipmap-$d/*.png $RES/mipmap-$d/
          done
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Forja.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Forja-apk
          path: Forja.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete descarga --cleanup-tag -y || true
          gh release create descarga Forja.apk --title "Forja (Android)" --notes "Descarga Forja.apk en el móvil y ábrelo para instalar la app."
