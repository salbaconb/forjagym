name: Build Forja

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Test de arranque (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox
      - name: Test de arranque (Windows y Mac)
        if: runner.os != 'Linux'
        run: npx electron . --smoke-test
      - run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: forja-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la installers
          gh release delete descarga --cleanup-tag -y || true
          gh release create descarga installers/* \
            --title "Forja" \
            --notes "Descarga el instalador de tu sistema: Windows (.exe), Mac (.dmg) o Linux (.AppImage)."
